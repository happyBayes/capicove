  ".internal", ".agents", ".codex", ".superpowers", ".cache", ".venv", ".worktrees",
  ".aws", ".ssh", ".huggingface",
  "docs/internal", "docs/prd", "docs/reports", "docs/superpowers",
  "sources", "reference", "tests/datasets", "artifacts", "data", "indexes",
  "models", "Models", "outputs", "output", "tmp", "site", "dist", "build",
]

