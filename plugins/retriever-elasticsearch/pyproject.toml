[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "capicove-retriever-elasticsearch"
version = "0.1.0"
description = "Lazy Elasticsearch text retriever plugin for Capicove."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
  "capicove>=0.1.0,<0.2",
  "elasticsearch>=8.19,<9",
]

[project.entry-points."capicove.retrievers"]
elasticsearch = "capicove_retriever_elasticsearch:elasticsearch_retriever_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/capicove_retriever_elasticsearch"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/LICENSE", "/README.md"]
