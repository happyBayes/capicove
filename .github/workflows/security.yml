name: Security

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, dev, "release/**"]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.26"

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --no-default-groups --group security
      - run: uv run --no-sync pre-commit run detect-secrets --all-files
      - run: uv run --no-sync bandit -q -c pyproject.toml -r src plugins/*/src
      # Audit the whole lock (every extra and dependency group), not only the
      # installed security environment. Every finding needs a reviewed disposition
      # before release; advisory exclusions must not be added automatically.
      - name: Audit every locked extra and dependency group
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project --no-hashes --output-file locked-requirements.txt
          uv run --no-sync pip-audit --requirement locked-requirements.txt --no-deps --disable-pip --strict --progress-spinner off
      - name: Audit the independent Spark lock
        run: |
          uv export --project plugins/execution-spark --frozen --all-extras --all-groups --no-emit-project --no-emit-package capicove --no-hashes --output-file spark-locked-requirements.txt
          uv run --no-sync pip-audit --requirement spark-locked-requirements.txt --no-deps --disable-pip --strict --progress-spinner off
