name: Manual graph slow tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.26"

jobs:
  graph-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --no-default-groups --group test --extra graph-data --extra graph-community
      - name: Run graph slow checks only when requested
        run: UV_NO_SYNC=1 make test-graph-slow
